description: >-
  FinOps view of Chroma spend. Chroma's core vector database is open source
  (Apache 2.0) and free to self-host - in that model the cost is your own
  compute, storage, and network for running the Chroma server, with no vendor
  invoice. Chroma Cloud is the managed, serverless offering billed on usage,
  metered primarily on data written, data stored, data queried, and network
  egress, above free credits. Enterprise agreements cover single-tenant clusters
  and negotiated terms.
notes: >-
  Cloud per-unit rates (writes, storage, queries, network) were captured from
  the pricing page and are not reconciled here; verify on
  https://www.trychroma.com/pricing. For self-hosted deployments the dominant
  costs are infrastructure (CPU/RAM for the index, disk for vectors) rather than
  a Chroma license fee.
sources:
