meters:
- name: data_written
  description: Data written into collections on Chroma Cloud, billed per GiB (observed ~$2.50/GiB).
  unit: bytes
  aggregation: sum
  dimensions:
  - account
  - database
  - collection
- name: data_stored
  description: Data stored in Chroma Cloud, billed per GiB per month (observed ~$0.33/GiB-month).
  unit: bytes
  aggregation: sum
  dimensions:
  - account
  - database
  - collection
- name: data_queried
  description: Data scanned by vector queries on Chroma Cloud (observed ~$0.0075/TiB queried).
  unit: bytes
  aggregation: sum
  dimensions:
  - account
  - collection
- name: network_egress
  description: Data returned over the network from Chroma Cloud (observed ~$0.09/GiB).
  unit: bytes
  aggregation: sum
  dimensions:
  - account
- name: self_hosted_compute
  description: Infrastructure cost of running the self-hosted Chroma server (no Chroma invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track write, storage, query, and egress volume per database and collection on Cloud; on self-hosted, monitor the Chroma server's compute and disk footprint.
- name: Allocation
  description: Name databases and collections per workload/team so usage maps to internal cost centers.
- name: Optimization
  description: Prune stale embeddings, right-size vector dimensions and index parameters, filter with metadata to reduce data queried, and self-host when volume makes owned infrastructure cheaper than Cloud metering.
- name: Accountability
  description: Assign owners per database; review monthly Cloud usage against free credits and plan limits, or self-hosted infrastructure budget.
