aid: chroma-db
url: https://raw.githubusercontent.com/api-evangelist/chroma-db/refs/heads/main/apis.yml
name: Chroma
kind: company
description: Chroma (Chroma DB) is an open-source, AI-native vector database (embedding
  database) for building LLM, RAG, and semantic-search applications. It provides
  storage, indexing, and retrieval for vector embeddings with metadata filtering,
  full-text and regex search, and multi-modal retrieval across text, images, and
  audio. Chroma is Apache-2.0 licensed and self-hostable via a single server, and
  is also available as Chroma Cloud, a serverless, usage-based managed offering.
  Its HTTP/REST v2 API is organized around tenants, databases, collections, and
  the records (embeddings) inside each collection - add, upsert, update, get,
  query (similarity search), and delete - and is the same interface used by the
  Python, JavaScript/TypeScript, Rust, and other client libraries.
